<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Relatórios - Sistema de Falhas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== VARIÁVEIS DE CORES E ESTILOS ===== */
        :root {
            --primary-color: #d32f2f;
            --primary-light: #f44336;
            --primary-dark: #b71c1c;
            --secondary-color: #fff5f5;
            --accent-color: #ffcdd2;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
            --bg-body: #e0e4e8;
            --bg-card: #ffffff;
            --border-radius: 16px;
            --box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --box-shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.15);
            --box-shadow-deep: 0 4px 15px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        /* ===== RESET E CONFIGURAÇÕES GERAIS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
        }

        /* ===== LAYOUT CONTAINER ===== */
        .container-moderno {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER COM BOTÕES ===== */
        .header-moderno {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            flex-wrap: wrap;
            gap: 15px;
        }

        .titulo-principal {
            color: var(--primary-dark);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .botoes-acao {
            display: flex;
            gap: 12px;
        }

        .btn-acao {
            background: var(--bg-body);
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            color: var(--text-color);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-acao:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--box-shadow);
        }

        .btn-acao.ativo {
            background: var(--primary-color);
            color: white;
        }

        .usuario-info {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== CARDS ===== */
        .card-moderno {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition);
        }

        .card-moderno:hover {
            box-shadow: var(--box-shadow-hover);
        }

        /* ===== TABS ===== */
        .tabs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-light);
            border-radius: 30px;
        }

        .tab.active {
            color: var(--primary-color);
            background: var(--secondary-color);
        }

        .data-hora-editable {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .data-hora-editable input {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            background: var(--bg-card);
            transition: var(--transition);
        }

        .data-hora-editable input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(244, 67, 54, 0.1);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FORMULÁRIOS ===== */
        .form-group-moderno {
            margin-bottom: 20px;
        }

        .label-moderno {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-dark);
            font-size: 13px;
        }

        .input-moderno, .select-moderno, .textarea-moderno {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            transition: var(--transition);
            background-color: #fafafa;
            font-family: inherit;
        }

        .input-moderno:focus, .select-moderno:focus, .textarea-moderno:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.1);
            background-color: white;
        }

        .textarea-moderno {
            resize: vertical;
        }

        /* ===== ABAS DINÂMICAS ===== */
        .indicadores-container {
            display: flex;
            gap: 25px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .indicador-coluna {
            flex: 1;
            min-width: 200px;
        }

        .indicador-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            border-left: 3px solid var(--primary-color);
        }

        .indicador-titulo {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary-dark);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .opcoes-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opcao-radio {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .opcao-radio:hover {
            background: var(--secondary-color);
            transform: translateX(3px);
        }

        .opcao-radio input[type="radio"] {
            cursor: pointer;
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
        }

        .opcao-radio label {
            cursor: pointer;
            flex: 1;
            font-weight: normal;
            font-size: 13px;
        }

        /* ===== BOTÕES ===== */
        .btn-primario {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-primario:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.25);
        }

        .btn-secundario {
            background: #e0e0e0;
            color: var(--text-color);
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secundario:hover {
            background: #d0d0d0;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        /* ===== LAYOUT EM GRID ===== */
        .linha-formulario {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .linha-formulario .form-group-moderno {
            flex: 1;
            margin-bottom: 0;
        }

        /* ===== ESTADOS E UTILITÁRIOS ===== */
        .oculto {
            display: none;
        }

        /* ===== TABELAS ===== */
        .tabela-container {
            overflow-x: auto;
            border-radius: 12px;
        }

        .tabela-historico {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .tabela-historico th {
            background: var(--primary-color);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 500;
        }

        .tabela-historico td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tabela-historico tr:hover {
            background: var(--secondary-color);
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            background: var(--primary-light);
            color: white;
            margin-left: 5px;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #27ae60;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            font-size: 14px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: var(--box-shadow-hover);
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .modal-content button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ===== FILTROS ===== */
        .filtros-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filtro-group {
            flex: 1;
            min-width: 150px;
        }

        .filtro-group label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 5px;
            display: block;
        }

        .btn-filtro {
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ===== RESPONSIVIDADE ===== */
        @media (max-width: 768px) {
            .linha-formulario {
                flex-direction: column;
                gap: 15px;
            }
            
            .indicadores-container {
                flex-direction: column;
            }
            
            .tabs-container {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .data-hora-editable {
                align-self: flex-end;
            }
            
            .header-moderno {
                flex-direction: column;
                text-align: center;
            }
            
            .tabela-historico {
                font-size: 11px;
            }
            
            .tabela-historico th, .tabela-historico td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container-moderno">
        <!-- Header com botões de modo -->
        <div class="header-moderno">
            <h1 class="titulo-principal">
                <i class="fas fa-bug"></i>
                Portal de Relatórios de Falhas
            </h1>
            <div class="botoes-acao">
                <button id="btn-modo-visualizador" class="btn-acao" title="Modo Visualizador">
                    <i class="fas fa-eye"></i>
                </button>
                <button id="btn-modo-adm" class="btn-acao" title="Modo Administrador">
                    <i class="fas fa-cog"></i>
                </button>
                <button id="btn-logout" class="btn-acao oculto" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <span id="modo-status" class="usuario-info">Modo: Visualizador</span>
            </div>
        </div>

        <!-- Card Principal -->
        <div class="card-moderno">
            <!-- Tabs com Data/Hora no canto -->
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab active" onclick="mudarTab('registro')">
                        <i class="fas fa-pen-alt"></i> Novo Registro
                    </button>
                    <button class="tab" onclick="mudarTab('chamados')">
                        <i class="fas fa-ticket-alt"></i> Chamados
                    </button>
                    <button class="tab" onclick="mudarTab('historico')">
                        <i class="fas fa-history"></i> Histórico
                    </button>
                </div>
                <div class="data-hora-editable">
                    <input type="date" id="data-ocorrencia" class="input-data">
                    <input type="time" id="hora-ocorrencia" class="input-hora">
                </div>
            </div>

            <!-- Aba de Registro -->
            <div id="tab-registro" class="tab-content active">
                <div class="form-group-moderno">
                    <label class="label-moderno" for="titulo-falha">Título da Falha</label>
                    <select id="titulo-falha" class="select-moderno">
                        <option value="">Selecione um tipo de falha</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Ocorrência não encerrada">[PORTAL DE RELATÓRIO DE FALHAS] - Ocorrência não encerrada</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Falha no escalonamento">[PORTAL DE RELATÓRIO DE FALHAS] - Falha no escalonamento</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Falha na atualização">[PORTAL DE RELATÓRIO DE FALHAS] - Falha na atualização</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Falhas sistêmicas">[PORTAL DE RELATÓRIO DE FALHAS] - Falhas sistêmicas</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Abrangência">[PORTAL DE RELATÓRIO DE FALHAS] - Abrangência</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - REC em DP">[PORTAL DE RELATÓRIO DE FALHAS] - REC em DP</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Outros">[PORTAL DE RELATÓRIO DE FALHAS] - Outros</option>
                        <option value="[PORTAL DE RELATÓRIO DE FALHAS] - Indicadores">[PORTAL DE RELATÓRIO DE FALHAS] - Indicadores</option>
                    </select>
                    <div id="campo-outros-titulo" class="oculto" style="margin-top:10px;">
                        <input type="text" id="outro-titulo" class="input-moderno" placeholder="Especifique o tipo de falha...">
                    </div>
                </div>

                <!-- Container para abas dinâmicas de Indicadores -->
                <div id="container-aba-dinamica"></div>

                <!-- Cluster, Incidente e Task/Sistema -->
                <div class="linha-formulario">
                    <div class="form-group-moderno">
                        <label class="label-moderno" for="cluster">Cluster</label>
                        <select id="cluster" class="select-moderno">
                            <option value="">Selecione o cluster</option>
                            <option value="N/A">N/A</option>
                            <option value="MG">MG</option>
                            <option value="CO">CO</option>
                            <option value="NO">NO</option>
                            <option value="NE">NE</option>
                            <option value="ES">ES</option>
                            <option value="RJ">RJ</option>
                        </select>
                    </div>
                    
                    <div class="form-group-moderno">
                        <label class="label-moderno" for="incidente">Incidente</label>
                        <input type="text" id="incidente" class="input-moderno" placeholder="Número do incidente">
                    </div>
                    
                    <div class="form-group-moderno" id="campo-task-container">
                        <label class="label-moderno" for="task">Task</label>
                        <input type="text" id="task" class="input-moderno" placeholder="Número da task">
                    </div>

                    <div class="form-group-moderno oculto" id="campo-sistema-container">
                        <label class="label-moderno" for="sistema-afetado">Sistema Afetado</label>
                        <select id="sistema-afetado" class="select-moderno">
                            <option value="">Selecione o sistema</option>
                            <option value="SIR">SIR</option>
                            <option value="TOA">TOA</option>
                            <option value="OSS">OSS</option>
                            <option value="VPN">VPN</option>
                            <option value="SGO">SGO</option>
                            <option value="OUTROS">OUTROS</option>
                        </select>
                        <div id="campo-outros-sistema" class="oculto" style="margin-top:10px;">
                            <input type="text" id="outro-sistema" class="input-moderno" placeholder="Especifique o sistema">
                        </div>
                    </div>
                </div>
                
                <div class="form-group-moderno">
                    <label class="label-moderno" for="descricao-falha">Descrição da Falha</label>
                    <textarea id="descricao-falha" class="textarea-moderno" rows="4" placeholder="Descreva a falha em detalhes..."></textarea>
                </div>
                
                <button id="botao-registrar-falha" class="btn-primario">
                    <i class="fas fa-save"></i> Registrar Falha
                </button>
            </div>

            <!-- Aba de Chamados -->
            <div id="tab-chamados" class="tab-content">
                <div class="form-group-moderno">
                    <label class="label-moderno" for="numero-chamado">Número do Chamado</label>
                    <input type="text" id="numero-chamado" class="input-moderno" placeholder="Ex: INC-2024-001">
                </div>
                <div class="form-group-moderno">
                    <label class="label-moderno" for="motivo-chamado">Motivo</label>
                    <select id="motivo-chamado" class="select-moderno">
                        <option value="">Selecione o motivo</option>
                        <option value="SIR">SIR</option>
                        <option value="TOA">TOA</option>
                        <option value="OSS">OSS</option>
                        <option value="VPN">VPN</option>
                        <option value="SGO">SGO</option>
                        <option value="OUTROS">OUTROS</option>
                    </select>
                    <div id="campo-outros-motivo" class="oculto" style="margin-top:10px;">
                        <input type="text" id="outro-motivo" class="input-moderno" placeholder="Especifique o motivo">
                    </div>
                </div>
                <button id="botao-registrar-chamado" class="btn-primario">
                    <i class="fas fa-plus-circle"></i> Registrar Chamado
                </button>

                <!-- Lista de Chamados -->
                <div style="margin-top: 30px;">
                    <h3 style="font-size: 16px; margin-bottom: 15px;">Chamados Registrados</h3>
                    <div class="tabela-container">
                        <table class="tabela-historico">
                            <thead>
                                <tr>
                                    <th>Data/Hora</th>
                                    <th>Número do Chamado</th>
                                    <th>Motivo</th>
                                    <th id="coluna-acao-chamados" class="oculto">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-chamados">
                                <tr>
                                    <td colspan="3" style="text-align: center;">Nenhum chamado registrado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Aba de Histórico -->
            <div id="tab-historico" class="tab-content">
                <!-- Filtros -->
                <div class="filtros-container">
                    <div class="filtro-group">
                        <label>Filtrar por Título</label>
                        <select id="filtro-titulo" class="select-moderno" style="padding: 8px;">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="filtro-group">
                        <label>Filtrar por Cluster</label>
                        <select id="filtro-cluster" class="select-moderno" style="padding: 8px;">
                            <option value="">Todos</option>
                            <option value="N/A">N/A</option>
                            <option value="MG">MG</option>
                            <option value="CO">CO</option>
                            <option value="NO">NO</option>
                            <option value="NE">NE</option>
                            <option value="ES">ES</option>
                            <option value="RJ">RJ</option>
                        </select>
                    </div>
                    <div class="filtro-group">
                        <label>Filtrar por Sistema/Task</label>
                        <input type="text" id="filtro-sistema" class="input-moderno" placeholder="Buscar..." style="padding: 8px;">
                    </div>
                    <button id="aplicar-filtros" class="btn-filtro">
                        <i class="fas fa-search"></i> Filtrar
                    </button>
                    <button id="limpar-filtros" class="btn-secundario">
                        <i class="fas fa-eraser"></i> Limpar
                    </button>
                </div>

                <div class="tabela-container">
                    <table class="tabela-historico">
                        <thead>
                            <tr>
                                <th>Data/Hora</th>
                                <th>Título</th>
                                <th>Cluster</th>
                                <th>Incidente</th>
                                <th>Task/Sistema</th>
                                <th id="coluna-acao-historico" class="oculto">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-historico">
                            <tr>
                                <td colspan="5" style="text-align: center;">Nenhum registro encontrado</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 20px; color: var(--text-light); font-size: 12px;">
            Desenvolvido por N5923221
        </footer>
    </div>

    <!-- Modal de Login -->
    <div id="modal-login" class="modal">
        <div class="modal-content">
            <i class="fas fa-lock" style="font-size: 40px; color: var(--primary-color);"></i>
            <h3 style="margin: 15px 0;">Acesso Administrador</h3>
            <input type="text" id="login-usuario" placeholder="Usuário">
            <input type="password" id="login-senha" placeholder="Senha">
            <button id="btn-login" style="background: var(--primary-color); color: white;">Entrar</button>
            <button id="btn-fechar-modal" style="background: #ccc;">Cancelar</button>
        </div>
    </div>

    <script>
        // Variáveis globais
        let historicoFalhas = [];
        let chamados = [];
        let opcaoIndicadoresSelecionada = null;
        let opcaoDetalheSelecionada = null;
        let modoAtual = 'visualizador'; // visualizador ou admin
        let usuarioLogado = false;

        // Função para limpar e formatar texto (caixa alta + correções ortográficas)
        function formatarTexto(texto) {
            if (!texto) return '';
            
            let formatado = texto.trim();
            
            // Remover espaços duplicados no meio (apenas um espaço)
            formatado = formatado.replace(/\s+/g, ' ');
            
            // Remover espaços antes de pontuação
            formatado = formatado.replace(/\s+([.,!?;:])/g, '$1');
            
            // Remover múltiplos sinais de pontuação repetidos
            formatado = formatado.replace(/([!?]){2,}/g, '$1');
            formatado = formatado.replace(/(\.){2,}/g, '$1');
            formatado = formatado.replace(/,{2,}/g, ',');
            
            // Converter para CAIXA ALTA
            formatado = formatado.toUpperCase();
            
            return formatado;
        }

        // Salvar dados no localStorage
        function salvarDados() {
            localStorage.setItem('historicoFalhas', JSON.stringify(historicoFalhas));
            localStorage.setItem('chamados', JSON.stringify(chamados));
        }

        // Carregar dados do localStorage
        function carregarDados() {
            const savedHistorico = localStorage.getItem('historicoFalhas');
            const savedChamados = localStorage.getItem('chamados');
            
            if (savedHistorico) {
                historicoFalhas = JSON.parse(savedHistorico);
            }
            if (savedChamados) {
                chamados = JSON.parse(savedChamados);
            }
            
            atualizarTabelaHistorico();
            atualizarTabelaChamados();
            atualizarFiltros();
        }

        // Atualizar opções de filtro
        function atualizarFiltros() {
            const titulosUnicos = [...new Set(historicoFalhas.map(f => f.titulo))];
            const selectFiltro = document.getElementById('filtro-titulo');
            selectFiltro.innerHTML = '<option value="">Todos</option>' + 
                titulosUnicos.map(t => `<option value="${t}">${t.substring(0, 50)}${t.length > 50 ? '...' : ''}</option>`).join('');
        }

        // Aplicar filtros
        function aplicarFiltros() {
            const filtroTitulo = document.getElementById('filtro-titulo').value;
            const filtroCluster = document.getElementById('filtro-cluster').value;
            const filtroSistema = document.getElementById('filtro-sistema').value.toLowerCase();
            
            let filtrados = [...historicoFalhas];
            
            if (filtroTitulo) {
                filtrados = filtrados.filter(f => f.titulo === filtroTitulo);
            }
            if (filtroCluster) {
                filtrados = filtrados.filter(f => f.cluster === filtroCluster);
            }
            if (filtroSistema) {
                filtrados = filtrados.filter(f => f.taskOuSistema.toLowerCase().includes(filtroSistema));
            }
            
            const corpo = document.getElementById('corpo-historico');
            if (filtrados.length === 0) {
                corpo.innerHTML = '<tr><td colspan="' + (modoAtual === 'admin' ? '6' : '5') + '" style="text-align: center;">Nenhum registro encontrado</td></tr>';
                return;
            }
            
            corpo.innerHTML = filtrados.map((falha, index) => `
                <tr>
                    <td>${falha.dataHora}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${falha.titulo}</td>
                    <td>${falha.cluster}</td>
                    <td>${falha.incidente || 'N/A'}</td>
                    <td>${falha.taskOuSistema}</td>
                    ${modoAtual === 'admin' ? `<td><button class="btn-secundario" style="padding: 4px 8px; background: #e74c3c; color: white;" onclick="deletarRegistro(${falha.id})"><i class="fas fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        // Atualizar tabela de histórico
        function atualizarTabelaHistorico() {
            const corpo = document.getElementById('corpo-historico');
            const colunaAcao = document.getElementById('coluna-acao-historico');
            
            if (modoAtual === 'admin') {
                colunaAcao.classList.remove('oculto');
            } else {
                colunaAcao.classList.add('oculto');
            }
            
            if (historicoFalhas.length === 0) {
                corpo.innerHTML = '<tr><td colspan="' + (modoAtual === 'admin' ? '6' : '5') + '" style="text-align: center;">Nenhum registro encontrado</td></tr>';
                return;
            }
            
            corpo.innerHTML = historicoFalhas.map(falha => `
                <tr>
                    <td>${falha.dataHora}</td>
                    <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${falha.titulo}</td>
                    <td>${falha.cluster}</td>
                    <td>${falha.incidente || 'N/A'}</td>
                    <td>${falha.taskOuSistema}</td>
                    ${modoAtual === 'admin' ? `<td><button class="btn-secundario" style="padding: 4px 8px; background: #e74c3c; color: white;" onclick="deletarRegistro(${falha.id})"><i class="fas fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        // Deletar registro individual
        function deletarRegistro(id) {
            if (confirm('Tem certeza que deseja excluir este registro?')) {
                historicoFalhas = historicoFalhas.filter(f => f.id !== id);
                salvarDados();
                atualizarTabelaHistorico();
                atualizarFiltros();
                mostrarToast('Registro excluído com sucesso!');
            }
        }

        // Atualizar tabela de chamados
        function atualizarTabelaChamados() {
            const corpo = document.getElementById('corpo-chamados');
            const colunaAcao = document.getElementById('coluna-acao-chamados');
            
            if (modoAtual === 'admin') {
                colunaAcao.classList.remove('oculto');
            } else {
                colunaAcao.classList.add('oculto');
            }
            
            if (chamados.length === 0) {
                corpo.innerHTML = '<tr><td colspan="' + (modoAtual === 'admin' ? '4' : '3') + '" style="text-align: center;">Nenhum chamado registrado</td></tr>';
                return;
            }
            
            corpo.innerHTML = chamados.map(chamado => `
                <tr>
                    <td>${chamado.dataHora}</td>
                    <td>${chamado.numero}</td>
                    <td>${chamado.motivo}</td>
                    ${modoAtual === 'admin' ? `<td><button class="btn-secundario" style="padding: 4px 8px; background: #e74c3c; color: white;" onclick="deletarChamado(${chamado.id})"><i class="fas fa-trash"></i></button></td>` : ''}
                </tr>
            `).join('');
        }

        // Deletar chamado
        function deletarChamado(id) {
            if (confirm('Tem certeza que deseja excluir este chamado?')) {
                chamados = chamados.filter(c => c.id !== id);
                salvarDados();
                atualizarTabelaChamados();
                mostrarToast('Chamado excluído com sucesso!');
            }
        }

        // Mostrar toast
        function mostrarToast(mensagem) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${mensagem}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Mudar tab
        function mudarTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            
            if (tab === 'registro') {
                tabs[0].classList.add('active');
                document.getElementById('tab-registro').classList.add('active');
            } else if (tab === 'chamados') {
                tabs[1].classList.add('active');
                document.getElementById('tab-chamados').classList.add('active');
            } else {
                tabs[2].classList.add('active');
                document.getElementById('tab-historico').classList.add('active');
                aplicarFiltros();
            }
        }

        // Criar interface de Indicadores
        function criarAbaDinamica() {
            const container = document.getElementById('container-aba-dinamica');
            container.innerHTML = '';
            opcaoIndicadoresSelecionada = null;
            opcaoDetalheSelecionada = null;

            container.innerHTML = `
                <div class="indicadores-container">
                    <div class="indicador-coluna" id="coluna-indicador">
                        <div class="indicador-card">
                            <div class="indicador-titulo">Tipo de indicador</div>
                            <div class="opcoes-container">
                                <div class="opcao-radio" onclick="selecionarIndicador(this, '[INDICADORES] - Etit')">
                                    <input type="radio" name="indicador" value="[INDICADORES] - Etit">
                                    <label>[INDICADORES] - Etit</label>
                                </div>
                                <div class="opcao-radio" onclick="selecionarIndicador(this, '[INDICADORES] - Chat')">
                                    <input type="radio" name="indicador" value="[INDICADORES] - Chat">
                                    <label>[INDICADORES] - Chat</label>
                                </div>
                                <div class="opcao-radio" onclick="selecionarIndicador(this, '[INDICADORES] - Tarefa cancelada')">
                                    <input type="radio" name="indicador" value="[INDICADORES] - Tarefa cancelada">
                                    <label>[INDICADORES] - Tarefa cancelada</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="indicador-coluna" id="coluna-detalhe">
                        <div class="indicador-card" style="background: #f0f0f0;">
                            <div class="indicador-titulo">Selecione o detalhamento</div>
                            <div class="opcoes-container" id="opcoes-detalhe-container">
                                <div style="padding: 10px; text-align: center; color: var(--text-light); font-size: 12px;">
                                    Selecione um tipo de indicador primeiro
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selecionarIndicador(element, valor) {
            const radios = document.querySelectorAll('#coluna-indicador input[name="indicador"]');
            radios.forEach(radio => {
                radio.checked = false;
                radio.parentElement.style.background = 'white';
            });
            
            const radio = element.querySelector('input');
            radio.checked = true;
            element.style.background = 'var(--secondary-color)';
            
            opcaoIndicadoresSelecionada = valor;
            
            let opcoesDetalhe = [];
            if (valor === '[INDICADORES] - Tarefa cancelada') {
                opcoesDetalhe = [
                    'Erro de abertura',
                    'Alarme improcedente',
                    'Agrupamento de incidente',
                    'Normalizado sem intervenção'
                ];
            } else if (valor === '[INDICADORES] - Chat' || valor === '[INDICADORES] - Etit') {
                opcoesDetalhe = [
                    'Alta demanda',
                    'Ferramenta inoperante',
                    'Falta de energia/internet na residência'
                ];
            }
            
            const containerDetalhe = document.getElementById('opcoes-detalhe-container');
            if (opcoesDetalhe.length > 0) {
                containerDetalhe.innerHTML = opcoesDetalhe.map(op => `
                    <div class="opcao-radio" onclick="selecionarDetalhe(this, '${op}')">
                        <input type="radio" name="detalhe" value="${op}">
                        <label>${op}</label>
                    </div>
                `).join('');
                opcaoDetalheSelecionada = null;
            } else {
                containerDetalhe.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--text-light); font-size: 12px;">Opções indisponíveis</div>';
            }
        }

        function selecionarDetalhe(element, valor) {
            const radios = document.querySelectorAll('#opcoes-detalhe-container input[name="detalhe"]');
            radios.forEach(radio => {
                radio.checked = false;
                radio.parentElement.style.background = 'white';
            });
            
            const radio = element.querySelector('input');
            radio.checked = true;
            element.style.background = 'var(--secondary-color)';
            
            opcaoDetalheSelecionada = valor;
        }

        // Alternar entre Task e Sistema Afetado
        function alternarTaskSistema(tituloSelecionado) {
            const taskContainer = document.getElementById('campo-task-container');
            const sistemaContainer = document.getElementById('campo-sistema-container');
            
            if (tituloSelecionado === '[PORTAL DE RELATÓRIO DE FALHAS] - Falhas sistêmicas') {
                taskContainer.classList.add('oculto');
                sistemaContainer.classList.remove('oculto');
            } else {
                taskContainer.classList.remove('oculto');
                sistemaContainer.classList.add('oculto');
            }
        }

        // Eventos
        document.getElementById('titulo-falha').addEventListener('change', function() {
            const campoOutros = document.getElementById('campo-outros-titulo');
            const containerAba = document.getElementById('container-aba-dinamica');
            
            if (this.value === '[PORTAL DE RELATÓRIO DE FALHAS] - Outros') {
                campoOutros.classList.remove('oculto');
            } else {
                campoOutros.classList.add('oculto');
                document.getElementById('outro-titulo').value = '';
            }
            
            if (this.value === '[PORTAL DE RELATÓRIO DE FALHAS] - Indicadores') {
                criarAbaDinamica();
            } else {
                containerAba.innerHTML = '';
                opcaoIndicadoresSelecionada = null;
                opcaoDetalheSelecionada = null;
            }
            
            alternarTaskSistema(this.value);
        });

        document.getElementById('sistema-afetado').addEventListener('change', function() {
            const campoOutros = document.getElementById('campo-outros-sistema');
            if (this.value === 'OUTROS') {
                campoOutros.classList.remove('oculto');
            } else {
                campoOutros.classList.add('oculto');
                document.getElementById('outro-sistema').value = '';
            }
        });

        document.getElementById('motivo-chamado').addEventListener('change', function() {
            const campoOutros = document.getElementById('campo-outros-motivo');
            if (this.value === 'OUTROS') {
                campoOutros.classList.remove('oculto');
            } else {
                campoOutros.classList.add('oculto');
                document.getElementById('outro-motivo').value = '';
            }
        });

        document.getElementById('descricao-falha').addEventListener('input', function() {
            const cursorPos = this.selectionStart;
            const formatted = formatarTexto(this.value);
            if (formatted !== this.value) {
                this.value = formatted;
                this.setSelectionRange(cursorPos, cursorPos);
            }
        });

        // Registrar falha
        document.getElementById('botao-registrar-falha').addEventListener('click', function() {
            let titulo = document.getElementById('titulo-falha').value;
            
            if (!titulo) {
                mostrarToast('Por favor, selecione o título da falha!');
                return;
            }
            
            if (titulo === '[PORTAL DE RELATÓRIO DE FALHAS] - Outros') {
                const outroTitulo = document.getElementById('outro-titulo').value;
                if (!outroTitulo) {
                    mostrarToast('Por favor, especifique o tipo de falha!');
                    return;
                }
                titulo = `[PORTAL DE RELATÓRIO DE FALHAS] - ${outroTitulo}`;
            }
            
            if (document.getElementById('titulo-falha').value === '[PORTAL DE RELATÓRIO DE FALHAS] - Indicadores') {
                if (!opcaoIndicadoresSelecionada) {
                    mostrarToast('Por favor, selecione uma opção de indicador!');
                    return;
                }
                if (!opcaoDetalheSelecionada) {
                    mostrarToast('Por favor, selecione o detalhamento da falha!');
                    return;
                }
                titulo = `${titulo} - ${opcaoIndicadoresSelecionada} - ${opcaoDetalheSelecionada}`;
            }
            
            const cluster = document.getElementById('cluster').value;
            const incidente = document.getElementById('incidente').value;
            
            let taskOuSistema = '';
            const isFalhasSistemicas = document.getElementById('titulo-falha').value === '[PORTAL DE RELATÓRIO DE FALHAS] - Falhas sistêmicas';
            
            if (isFalhasSistemicas) {
                let sistema = document.getElementById('sistema-afetado').value;
                if (!sistema) {
                    mostrarToast('Por favor, selecione o sistema afetado!');
                    return;
                }
                if (sistema === 'OUTROS') {
                    const outroSistema = document.getElementById('outro-sistema').value;
                    if (!outroSistema) {
                        mostrarToast('Por favor, especifique o sistema afetado!');
                        return;
                    }
                    sistema = outroSistema;
                }
                taskOuSistema = `SISTEMA: ${sistema}`;
            } else {
                const task = document.getElementById('task').value;
                if (!task) {
                    mostrarToast('Por favor, informe o número da task!');
                    return;
                }
                taskOuSistema = `TASK: ${task}`;
            }
            
            if (!cluster) {
                mostrarToast('Por favor, selecione o cluster!');
                return;
            }
            
            let descricao = document.getElementById('descricao-falha').value;
            if (!descricao) {
                mostrarToast('Por favor, preencha a descrição da falha!');
                return;
            }
            
            descricao = formatarTexto(descricao);
            
            const data = document.getElementById('data-ocorrencia').value;
            const hora = document.getElementById('hora-ocorrencia').value;
            
            if (!data || !hora) {
                mostrarToast('Por favor, preencha data e hora da ocorrência!');
                return;
            }
            
            const dataFormatada = new Date(data).toLocaleDateString('pt-BR');
            const dataHora = `${dataFormatada} ${hora}`;
            
            const novaFalha = {
                id: Date.now(),
                dataHora: dataHora,
                titulo: titulo,
                cluster: cluster,
                incidente: incidente || 'N/A',
                taskOuSistema: taskOuSistema,
                descricao: descricao
            };
            
            historicoFalhas.unshift(novaFalha);
            salvarDados();
            
            // Limpar formulário
            document.getElementById('titulo-falha').value = '';
            document.getElementById('cluster').value = '';
            document.getElementById('incidente').value = '';
            document.getElementById('task').value = '';
            document.getElementById('sistema-afetado').value = '';
            document.getElementById('descricao-falha').value = '';
            document.getElementById('container-aba-dinamica').innerHTML = '';
            document.getElementById('campo-outros-titulo').classList.add('oculto');
            document.getElementById('campo-outros-sistema').classList.add('oculto');
            document.getElementById('campo-task-container').classList.remove('oculto');
            document.getElementById('campo-sistema-container').classList.add('oculto');
            
            opcaoIndicadoresSelecionada = null;
            opcaoDetalheSelecionada = null;
            
            mostrarToast('REGISTRO CONCLUÍDO! ✓');
            atualizarTabelaHistorico();
            atualizarFiltros();
            mudarTab('historico');
        });

        // Registrar chamado
        document.getElementById('botao-registrar-chamado').addEventListener('click', function() {
            const numero = document.getElementById('numero-chamado').value;
            let motivo = document.getElementById('motivo-chamado').value;
            
            if (!numero) {
                mostrarToast('Por favor, informe o número do chamado!');
                return;
            }
            
            if (!motivo) {
                mostrarToast('Por favor, selecione o motivo!');
                return;
            }
            
            if (motivo === 'OUTROS') {
                const outroMotivo = document.getElementById('outro-motivo').value;
                if (!outroMotivo) {
                    mostrarToast('Por favor, especifique o motivo!');
                    return;
                }
                motivo = outroMotivo;
            }
            
            const data = document.getElementById('data-ocorrencia').value;
            const hora = document.getElementById('hora-ocorrencia').value;
            const dataFormatada = new Date(data).toLocaleDateString('pt-BR');
            const dataHora = `${dataFormatada} ${hora}`;
            
            const novoChamado = {
                id: Date.now(),
                dataHora: dataHora,
                numero: numero,
                motivo: motivo
            };
            
            chamados.unshift(novoChamado);
            salvarDados();
            
            document.getElementById('numero-chamado').value = '';
            document.getElementById('motivo-chamado').value = '';
            document.getElementById('campo-outros-motivo').classList.add('oculto');
            document.getElementById('outro-motivo').value = '';
            
            mostrarToast('CHAMADO REGISTRADO! ✓');
            atualizarTabelaChamados();
        });

        // Limpar histórico (admin apenas)
        document.getElementById('limpar-historico')?.addEventListener('click', function() {
            if (modoAtual !== 'admin') return;
            if (confirm('Você tem certeza que deseja limpar todo o histórico?')) {
                historicoFalhas = [];
                salvarDados();
                atualizarTabelaHistorico();
                atualizarFiltros();
                mostrarToast('Histórico limpo com sucesso!');
            }
        });

        // Modo Visualizador
        document.getElementById('btn-modo-visualizador').addEventListener('click', function() {
            modoAtual = 'visualizador';
            usuarioLogado = false;
            document.getElementById('modo-status').innerHTML = 'Modo: Visualizador';
            document.getElementById('btn-modo-visualizador').classList.add('ativo');
            document.getElementById('btn-modo-adm').classList.remove('ativo');
            document.getElementById('btn-logout').classList.add('oculto');
            atualizarTabelaHistorico();
            atualizarTabelaChamados();
            mostrarToast('Modo Visualizador ativado - Você pode visualizar, mas não pode excluir');
        });

        // Modal Admin
        const modal = document.getElementById('modal-login');
        
        document.getElementById('btn-modo-adm').addEventListener('click', function() {
            modal.style.display = 'flex';
        });
        
        document.getElementById('btn-fechar-modal').addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        document.getElementById('btn-login').addEventListener('click', function() {
            const usuario = document.getElementById('login-usuario').value;
            const senha = document.getElementById('login-senha').value;
            
            if (usuario === 'claro123' && senha === 'claro123') {
                modal.style.display = 'none';
                modoAtual = 'admin';
                usuarioLogado = true;
                document.getElementById('modo-status').innerHTML = 'Modo: Administrador';
                document.getElementById('btn-modo-adm').classList.add('ativo');
                document.getElementById('btn-modo-visualizador').classList.remove('ativo');
                document.getElementById('btn-logout').classList.remove('oculto');
                atualizarTabelaHistorico();
                atualizarTabelaChamados();
                mostrarToast('Modo Administrador ativado - Acesso total concedido');
            } else {
                alert('Usuário ou senha incorretos!');
            }
        });
        
        document.getElementById('btn-logout').addEventListener('click', function() {
            modoAtual = 'visualizador';
            usuarioLogado = false;
            document.getElementById('modo-status').innerHTML = 'Modo: Visualizador';
            document.getElementById('btn-modo-visualizador').classList.add('ativo');
            document.getElementById('btn-modo-adm').classList.remove('ativo');
            document.getElementById('btn-logout').classList.add('oculto');
            atualizarTabelaHistorico();
            atualizarTabelaChamados();
            mostrarToast('Logout realizado com sucesso!');
        });
        
        document.getElementById('aplicar-filtros').addEventListener('click', aplicarFiltros);
        document.getElementById('limpar-filtros').addEventListener('click', function() {
            document.getElementById('filtro-titulo').value = '';
            document.getElementById('filtro-cluster').value = '';
            document.getElementById('filtro-sistema').value = '';
            atualizarTabelaHistorico();
        });

        // Inicializar
        function inicializarDataHora() {
            const hoje = new Date().toISOString().split('T')[0];
            const agora = new Date();
            const horas = agora.getHours().toString().padStart(2, '0');
            const minutos = agora.getMinutes().toString().padStart(2, '0');
            
            document.getElementById('data-ocorrencia').value = hoje;
            document.getElementById('hora-ocorrencia').value = `${horas}:${minutos}`;
        }
        
        inicializarDataHora();
        carregarDados();
        
        // Iniciar como visualizador
        document.getElementById('btn-modo-visualizador').classList.add('ativo');
    </script>
</body>
</html>
